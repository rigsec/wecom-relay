version: '3.8'

services:
  wecom-relay:
    build: .
    container_name: wecom-relay
    ports:
      - '8000:8000'
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - WECOM_TOKEN=${WECOM_TOKEN}
      - WECOM_ENCODING_AES_KEY=${WECOM_ENCODING_AES_KEY}
      - WECOM_CORP_ID=${WECOM_CORP_ID}
      - RELAY_API_SECRET=${RELAY_API_SECRET:-}
      - RESPONSE_TTL_SECONDS=${RESPONSE_TTL_SECONDS:-86400}
